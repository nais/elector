name: Build and deploy elector

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    paths-ignore:
      - '*.md'

permissions:
  contents: write
  id-token: write

jobs:
  build-deploy:
    uses: nais/actions/.github/workflows/mise-build-deploy-fasit.yaml@fba6b04257cea335bdb7b516411820fcae03b727 # ratchet:nais/actions/.github/workflows/mise-build-deploy-fasit.yaml@main
    with:
      builds-chart: true
      deploys-to-fasit: true
      targets: |
        [
          { "target": { "kind": "tenant", "tenant": "ci-nais" }, "wait": true },
          { "target": { "kind": "onprem", "tenant": "ci-nais" }, "wait": true },
          { "target": { "kind": "tenant" } },
          { "target": { "kind": "onprem" } }
        ]
      mise-tasks: '["test:envtest", "check"]'
    secrets:
      NAIS_IO_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.NAIS_IO_WORKLOAD_IDENTITY_PROVIDER }}
